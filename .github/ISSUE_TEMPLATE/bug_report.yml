name: Bug report / 缺陷报告
description: Report a reproducible ContextLean defect / 报告可复现的 ContextLean 缺陷
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ContextLean. Remove credentials, private paths, configuration values, Agent transcripts, plans, backups, and receipts before submitting.

        感谢帮助改进 ContextLean。提交前请删除凭证、私人路径、配置值、Agent 会话、计划、备份和回执。
  - type: input
    id: version
    attributes:
      label: ContextLean version / 版本
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Agent client / Agent 客户端
      options:
        - ChatGPT Desktop / Codex
        - Claude Code / Claude Code Desktop
        - Other Agent Skills client
        - CLI only
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 环境
      description: Operating system and Node.js version / 操作系统与 Node.js 版本
      placeholder: macOS 15, Node.js 20.19.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction / 最小复现
      description: Include the exact command, using placeholders for private paths and values.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I removed secrets, private paths, configuration values, transcripts, plans, backups, and receipts. / 我已删除密钥、私人路径、配置值、会话、计划、备份和回执。
          required: true
